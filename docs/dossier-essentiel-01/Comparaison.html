<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dossier essentiel — comparaison</title><style>body{margin:0;background:#f6f3eb;color:#303d34;font:16px system-ui}main{max-width:1600px;margin:auto;padding:24px}h1{font-family:Georgia,serif;font-weight:400}label{display:inline-grid;gap:8px;margin:8px 18px 20px 0}select{font:inherit;padding:12px;background:#fffdf8;color:#303d34;border:1px solid #b6bdac;border-radius:7px}section{display:grid;grid-template-columns:1fr 1fr;gap:20px}figure{margin:0;background:#fffdf8;padding:12px;border:1px solid #d8d8c8;border-radius:8px}figcaption{padding:8px}img{width:100%;display:block}a{color:#4b6750}@media(max-width:650px){section{grid-template-columns:1fr}}</style><main><h1>Dossier essentiel · base 01</h1><p>Captures originales de l’application. Direction C approuvée ; navigation inchangée.</p><label>Format<select id="size"><option>800x1280</option><option>1280x800</option><option>360x740</option></select></label><label>Thème<select id="theme"><option>light</option><option>dark</option></select></label><label>Page<select id="scene"></select></label><section><figure><figcaption>Avant · essai précédent</figcaption><a id="oldlink"><img id="old" alt="Version précédente"></a></figure><figure><figcaption>Après · Dossier essentiel</figcaption><a id="newlink"><img id="new" alt="Style Dossier essentiel"></a></figure></section><p>Ouvrir une image pour la voir à sa taille réelle. Simulation tactile Chromium ; pas de tablette Android physique.</p></main><script>const names={dashboard:'Dashboard',patients:'Patients',consultations:'Consultations',examen:'Examen physique',helios:'HELIOS',ordonnances:'Ordonnances',protocoles:'Protocoles',inventaire:'Inventaire',parametres:'Paramètres'};function updateScenes(){const s=document.getElementById('scene'),prev=s.value,all=document.getElementById('size').value==='800x1280';s.replaceChildren();Object.entries(names).filter(([k])=>all||['dashboard','consultations','examen','helios'].includes(k)).forEach(([k,n])=>{let o=document.createElement('option');o.value=k;o.textContent=n;s.append(o)});if([...s.options].some(o=>o.value===prev))s.value=prev;update()}function update(){let f=document.getElementById('size').value+'-'+document.getElementById('theme').value+'-'+document.getElementById('scene').value+'.png';document.getElementById('old').src=document.getElementById('oldlink').href='avant/'+f;document.getElementById('new').src=document.getElementById('newlink').href='apres/'+f;}document.getElementById('size').onchange=updateScenes;document.getElementById('theme').onchange=update;document.getElementById('scene').onchange=update;updateScenes();</script></html>
