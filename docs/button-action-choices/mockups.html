<div id="mf-button-options">
  <style>
    #mf-button-options {color-scheme:light dark;color:light-dark(#303d34,#eef0e4);font:400 14px/1.5 system-ui,sans-serif;}
    #mf-button-options * {box-sizing:border-box;}
    #mf-button-options .choice-title {margin:0 0 14px;font:500 20px/1.4 system-ui,sans-serif;}
    #mf-button-options .choice-title small {display:block;margin-top:4px;font:400 14px/1.5 system-ui,sans-serif;}
    #mf-button-options .product {
      --paper:light-dark(#fffdf8,#2d2b25);--canvas:light-dark(#f6f3eb,#211f1b);
      --ink:light-dark(#303d34,#eef0e4);--muted:light-dark(#626b5d,#c1c7b6);
      --line:light-dark(#d8d8c8,#525447);--sage:light-dark(#4b6750,#b5d2a4);
      --soft:light-dark(#e9eddf,#394532);--on-sage:light-dark(#fff,#203324);
      --action-height:52px;--action-radius:7px;
      padding:24px;border:1px solid var(--line);border-radius:10px;background:var(--canvas);color:var(--ink);
      font:400 16px/1.5 system-ui,-apple-system,'Segoe UI',sans-serif;
    }
    #mf-button-options .brand {font:400 25px/1.3 Georgia,serif;}
    #mf-button-options .brand span {color:var(--sage);}
    #mf-button-options .identity {margin-top:14px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:4px 16px;border:1px solid var(--line);border-radius:7px;background:var(--soft);font-size:14px;}
    #mf-button-options .identity small {color:var(--muted);font-size:13px;}
    #mf-button-options .editor {margin-top:24px;padding-top:18px;border-top:1px solid var(--line);display:flex;flex-direction:column;min-height:374px;}
    #mf-button-options .product h3 {font:400 21px/1.4 Georgia,serif;margin:0 0 18px;}
    #mf-button-options .product label {display:grid;gap:8px;font-size:14px;min-width:0;}
    #mf-button-options .product input,#mf-button-options .product textarea {
      width:100%;min-width:0;min-height:52px;padding:12px 14px;border:1px solid var(--line);
      border-radius:7px;background:var(--paper);color:var(--ink);font:400 16px/1.5 system-ui,sans-serif;
    }
    #mf-button-options .product textarea {min-height:112px;resize:vertical;}
    #mf-button-options .product button {
      display:inline-flex;align-items:center;justify-content:center;min-height:var(--action-height);min-width:44px;
      padding:12px 18px;border:1px solid var(--line);border-radius:var(--action-radius);
      background:var(--paper);color:var(--ink);font:500 14px/1.5 system-ui,sans-serif;text-align:center;
    }
    #mf-button-options .product button.primary {background:var(--sage);color:var(--on-sage);border-color:var(--sage);}
    #mf-button-options .product button:disabled {background:var(--soft);color:var(--muted);border-color:var(--line);}
    #mf-button-options .product :is(button,input,textarea):focus-visible {outline:3px solid var(--sage);outline-offset:3px;}
    #mf-button-options .action-area {display:flex;align-items:center;gap:16px;margin-top:20px;}
    #mf-button-options .action-buttons {display:flex;flex-wrap:wrap;gap:10px;min-width:0;}
    #mf-button-options .bar-context {display:none;font-size:13px;color:var(--muted);}
    #mf-button-options .sample {margin-top:22px;border-top:1px solid var(--line);padding-top:20px;}
    #mf-button-options .sample h3 {margin-bottom:12px;}
    #mf-button-options .composer {display:flex;gap:10px;align-items:center;}
    #mf-button-options .composer input {flex:1;}
    #mf-button-options .disabled-label {margin:0 0 12px;color:var(--muted);font-size:14px;}
    #mf-button-options [data-option='b2'] {--action-height:64px;--action-radius:14px;}
    #mf-button-options [data-option='b2'] .action-buttons {display:grid;width:100%;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;}
    #mf-button-options [data-option='b2'] .action-buttons button {width:100%;font-size:16px;padding-inline:20px;}
    #mf-button-options [data-option='b2'] .composer button {padding-inline:26px;font-size:16px;}
    #mf-button-options [data-option='b2'] .disabled-button {width:100%;font-size:16px;}
    #mf-button-options [data-option='b3'] .action-area {
      margin-top:auto;margin-inline:-24px;margin-bottom:-1px;padding:16px 24px;
      border-block:1px solid var(--line);background:var(--paper);
    }
    #mf-button-options [data-option='b3'] .bar-context {display:block;flex:1;}
    #mf-button-options [data-option='b3'] .action-buttons {justify-content:flex-end;}
    #mf-button-options [data-option='b3'] .action-buttons .secondary {border-color:transparent;background:transparent;}
    #mf-button-options [data-option='b3'] .editor {min-height:424px;}
    @media(max-width:600px) {
      #mf-button-options .product {padding:18px 14px;}
      #mf-button-options .product h3 {font-size:20px;}
      #mf-button-options .action-buttons {width:100%;flex-direction:column;}
      #mf-button-options .action-buttons button {width:100%;}
      #mf-button-options [data-option='b2'] .action-buttons {grid-template-columns:minmax(0,1fr);}
      #mf-button-options .editor {min-height:442px;}
      #mf-button-options .composer {flex-wrap:wrap;}
      #mf-button-options .composer input {flex-basis:100%;}
      #mf-button-options .composer button {width:100%;}
      #mf-button-options [data-option='b3'] .action-area {margin-inline:-14px;padding:14px;flex-wrap:wrap;gap:10px;}
      #mf-button-options [data-option='b3'] .bar-context {flex-basis:100%;}
      #mf-button-options [data-option='b3'] .editor {min-height:504px;}
    }
  </style>
  <template id="mf-button-product">
    <div class="brand">MediFollow <span>AI</span></div>
    <div class="identity"><span>Dossier fictif A</span><small>Consultation · modification</small></div>
    <section class="editor">
      <h3>05 · Évaluation et prise en charge</h3>
      <label>Conduite à tenir<textarea rows="3" readonly>Plan fictif de démonstration.</textarea></label>
      <div class="action-area">
        <div class="bar-context">Dossier fictif A<br>Consultation en modification</div>
        <div class="action-buttons">
          <button type="button" class="primary">Enregistrer les modifications</button>
          <button type="button" class="secondary">Annuler la modification</button>
        </div>
      </div>
    </section>
    <section class="sample">
      <h3>HELIOS</h3>
      <div class="composer"><input aria-label="Question fictive à HELIOS" value="Question de démonstration" readonly><button type="button" class="primary">Envoyer</button></div>
    </section>
    <section class="sample">
      <p class="disabled-label">Sans patient sélectionné</p>
      <button type="button" class="disabled-button" disabled>Enregistrer la consultation</button>
    </section>
  </template>
  <div class="viz-carousel" aria-label="Propositions de boutons" data-previous-label="Précédent" data-next-label="Suivant">
    <section data-variant="Rectangles fins" aria-label="B1 — Rectangles fins">
      <h2 class="choice-title">B1 · Rectangles fins<small>52 px · coins de 7 px · actions près du formulaire</small></h2>
      <div class="product" id="mf-buttons-b1" data-option="b1" aria-label="Boutons rectangulaires sobres"></div>
    </section>
    <section data-variant="Tactile généreux" aria-label="B2 — Tactile généreux" hidden>
      <h2 class="choice-title">B2 · Tactile généreux<small>64 px · coins de 14 px · grandes surfaces tactiles</small></h2>
      <div class="product" id="mf-buttons-b2" data-option="b2" aria-label="Grands boutons tactiles"></div>
    </section>
    <section data-variant="Barre persistante" aria-label="B3 — Barre persistante" hidden>
      <h2 class="choice-title">B3 · Barre persistante<small>52 px · actions regroupées · barre prévue pendant le défilement</small></h2>
      <div class="product" id="mf-buttons-b3" data-option="b3" aria-label="Barre des actions du formulaire"></div>
    </section>
  </div>
  <script>
    (()=>{
      const root=document.getElementById('mf-button-options');
      const template=root.querySelector('#mf-button-product');
      for(const element of root.querySelectorAll('.product')){
        element.appendChild(template.content.cloneNode(true));
        const state={height:element.dataset.option==='b2'?64:52,radius:element.dataset.option==='b2'?14:7};
        const render=()=>{element.style.setProperty('--action-height',state.height+'px');element.style.setProperty('--action-radius',state.radius+'px')};
        render();
        if(globalThis.Tweak){
          const tweak=new Tweak({container:element,onChange:render});
          tweak.addSlider(state,'height',{label:'Hauteur des boutons',min:52,max:72,step:4,unit:'px'});
          tweak.addSlider(state,'radius',{label:'Arrondi des boutons',min:4,max:20,step:1,unit:'px'});
        }
      }
    })();
  </script>
</div>
