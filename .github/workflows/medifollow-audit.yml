name: MediFollow AI - controles paralleles

# Automated checks only. No code-writing AI, deployment, secrets, or production data.
on:
  push:
    branches:
      - audit-stabilisation-2026-11-10
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: medifollow-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilation TypeScript et Vite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer les dependances
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Compiler
        run: npm run build

  offline-tests:
    name: Tests / ${{ matrix.module }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: resilience-ia
            command: test:ai-resilience
          - module: clinique
            command: test:clinical-regression
          - module: dictionnaire-medical
            command: test:medical-dictionary
          - module: dictee-helios
            command: test:medical-speech
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer les dependances
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Executer les tests fictifs
        run: npm run ${{ matrix.command }}

  relay:
    name: Bilan des controles
    if: always()
    needs: [build, offline-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publier le relais sans ecriture au depot
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          TEST_RESULT: ${{ needs.offline-tests.result }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          {
            echo '## Relais MediFollow AI'
            echo "- Commit : $COMMIT_SHA"
            echo "- Compilation : $BUILD_RESULT"
            echo "- Tests hors ligne (4 modules) : $TEST_RESULT"
            echo '- Si echec : consulter les logs du job concerne avant de modifier le code.'
            echo '- Si succes : poursuivre les taches independantes sur la branche audit.'
            echo '- Ce workflow ne lance aucun agent IA et ne modifie aucun fichier.'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$BUILD_RESULT" != success ] || [ "$TEST_RESULT" != success ]; then
            exit 1
          fi
